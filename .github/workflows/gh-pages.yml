name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 14 * * 0,2,4" # UTC时间 14:15 (北京时间 22:15)，错开15分钟确保官网已产出数据

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
